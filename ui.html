<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Color Palette - Professional Developer Dark Theme */
      --bg-primary: #0F172A;
      --bg-secondary: #1E293B;
      --bg-tertiary: #334155;
      --bg-elevated: rgba(30, 41, 59, 0.8);
      
      /* Accent Colors */
      --accent-primary: #3B82F6;
      --accent-secondary: #60A5FA;
      --accent-gradient: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
      
      /* Text Colors */
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      
      /* Semantic Colors */
      --success: #22C55E;
      --success-bg: rgba(34, 197, 94, 0.1);
      --error: #EF4444;
      --error-bg: rgba(239, 68, 68, 0.1);
      
      /* Code Theme Colors */
      --code-blue: #60A5FA;
      --code-green: #4ADE80;
      --code-orange: #FB923C;
      --code-purple: #A78BFA;
      
      /* Border & Shadow */
      --border-color: rgba(148, 163, 184, 0.1);
      --border-hover: rgba(148, 163, 184, 0.2);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.3);
      
      /* Spacing */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      
      /* Transitions */
      --transition-fast: 150ms ease;
      --transition-normal: 200ms ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 16px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-icon {
      width: 28px;
      height: 28px;
      background: var(--accent-gradient);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-glow);
    }

    .header-icon svg {
      width: 16px;
      height: 16px;
      color: white;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      background: var(--bg-secondary);
      padding: 4px;
      border-radius: var(--radius-md);
    }

    .tab {
      flex: 1;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab svg {
      width: 14px;
      height: 14px;
      opacity: 0.7;
      transition: opacity var(--transition-fast);
    }

    .tab:hover {
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab:hover svg {
      opacity: 1;
    }

    .tab.active {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .tab.active svg {
      opacity: 1;
      color: var(--accent-secondary);
    }

    /* Output Container */
    .output-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .output {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 14px;
      overflow: auto;
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      font-size: 11px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
      transition: border-color var(--transition-normal);
      min-height: 70px;
    }

    .output:hover {
      border-color: var(--border-hover);
    }

    .output.active {
      display: block;
    }

    .output.console-view {
      color: var(--code-blue);
    }

    .output.json-view {
      color: var(--code-orange);
    }

    .output.tailwind-view {
      color: var(--code-green);
    }

    /* Custom Scrollbar */
    .output::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .output::-webkit-scrollbar-track {
      background: transparent;
    }

    .output::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 3px;
    }

    .output::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Progress Container */
    .progress-container {
      margin-top: 12px;
      padding: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      display: none;
    }

    .progress-container.visible {
      display: block;
    }

    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .progress-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .progress-label svg {
      width: 14px;
      height: 14px;
      color: var(--accent-primary);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .progress-count {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .progress-bar-bg {
      height: 4px;
      background: var(--bg-tertiary);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent-gradient);
      width: 0%;
      transition: width 100ms ease-out;
      border-radius: 2px;
    }

    /* Icon Preview */
    .icon-preview {
      margin-top: 12px;
      padding: 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      display: none;
    }

    .icon-preview.visible {
      display: block;
    }

    .icon-preview-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .icon-preview-header svg {
      width: 16px;
      height: 16px;
      color: var(--code-purple);
    }

    .icon-preview-header h3 {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .icon-preview-header .badge {
      font-size: 10px;
      padding: 2px 6px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border-radius: 10px;
      font-weight: 500;
    }

    .icon-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 70px;
      overflow-y: auto;
    }

    .icon-grid::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .icon-grid::-webkit-scrollbar-track {
      background: transparent;
    }

    .icon-grid::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 3px;
    }

    .icon-grid::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    .icon-item {
      padding: 10px;
      background: var(--bg-tertiary);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all var(--transition-fast);
      min-width: 64px;
    }

    .icon-item:hover {
      background: rgba(59, 130, 246, 0.1);
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }

    .icon-item:active {
      transform: scale(0.97);
    }

    .icon-item.copied {
      background: var(--success-bg);
      border-color: var(--success);
    }

    .icon-item svg {
      width: 24px;
      height: 24px;
      color: var(--text-primary);
    }

    .icon-item span {
      font-size: 9px;
      color: var(--text-muted);
      max-width: 56px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    /* Button Row */
    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button svg {
      width: 14px;
      height: 14px;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: white;
      flex: 1;
      box-shadow: var(--shadow-sm), 0 0 0 0 rgba(59, 130, 246, 0.3);
    }

    .btn-primary:hover {
      box-shadow: var(--shadow-md), var(--shadow-glow);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .btn-icon {
      padding: 10px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    /* Status */
    .status {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      font-size: 11px;
      display: none;
      align-items: center;
      gap: 8px;
      animation: slideUp 200ms ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .status svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .status.success {
      display: flex;
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .status.error {
      display: flex;
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 11px;
      font-weight: 500;
      opacity: 0;
      transition: transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 200ms ease;
      z-index: 1000;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast svg {
      width: 14px;
      height: 14px;
      color: var(--success);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      padding: 24px;
    }

    .empty-state svg {
      width: 32px;
      height: 32px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 12px;
      line-height: 1.5;
    }

    .output.debug-view {
      color: #f39c12;
    }

    .output.debug-view .log-entry {
      padding: 2px 0;
      border-bottom: 1px solid #ffffff08;
    }

    .output.images-view {
      display: none;
      flex-direction: column;
      gap: 10px;
      font-family: 'IBM Plex Sans', sans-serif;
      white-space: normal;
    }

    .output.images-view.active {
      display: flex;
    }

    .images-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .images-toolbar .meta {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .images-toolbar .btn-secondary {
      padding: 6px 10px;
      font-size: 10px;
    }

    .images-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .image-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      transition: border-color var(--transition-fast);
    }

    .image-row:hover {
      border-color: var(--border-hover);
    }

    .image-thumb {
      width: 48px;
      height: 48px;
      object-fit: contain;
      background: var(--bg-primary);
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    .image-info {
      flex: 1;
      min-width: 0;
    }

    .image-info .name {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .image-info .details {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .image-download-btn {
      padding: 6px 10px;
      font-size: 10px;
      flex-shrink: 0;
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
    <span id="toast-message">Copied to clipboard!</span>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m7.5 4.27 9 5.15"/>
        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
        <path d="m3.3 7 8.7 5 8.7-5"/>
        <path d="M12 22V12"/>
      </svg>
    </div>
    <h1>Block Structure Copier</h1>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="console">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 11 4 5"/>
        <line x1="12" x2="20" y1="19" y2="19"/>
      </svg>
      Console
    </button>
    <button class="tab" data-tab="json">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"/>
        <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
        <path d="m5 12-3 3 3 3"/>
        <path d="m9 18 3-3-3-3"/>
      </svg>
      JSON
    </button>
    <button class="tab" data-tab="images">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
        <circle cx="9" cy="9" r="2"/>
        <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
      </svg>
      Images
    </button>
    <button class="tab" data-tab="debug">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m8 2 1.88 1.88"/>
        <path d="M14.12 3.88 16 2"/>
        <path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/>
        <path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/>
        <path d="M12 20v-9"/>
        <path d="M6.53 9C4.6 8.8 3 7.1 3 5"/>
        <path d="M6 13H2"/>
        <path d="M3 21c0-2.1 1.7-3.9 3.8-4"/>
        <path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/>
        <path d="M22 13h-4"/>
        <path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/>
      </svg>
      Debug
    </button>
  </div>

  <!-- Output Container -->
  <div class="output-container">
    <pre class="output console-view active" id="console-output">Extracting structure...</pre>
    <pre class="output json-view" id="json-output">Extracting structure...</pre>
    <pre class="output tailwind-view" id="tailwind-output">Extracting structure...</pre>
    <div class="output debug-view" id="debug-output" style="font-size: 10px;"></div>
    <div class="output images-view" id="images-output">
      <div class="images-toolbar">
        <span class="meta" id="images-summary">No images in selection</span>
        <button type="button" class="btn-secondary" id="download-all-images-btn" disabled>Download all</button>
      </div>
      <div class="images-list" id="images-list"></div>
    </div>
  </div>

  <!-- Progress Bar -->
  <div id="progress-bar" class="progress-container">
    <div class="progress-header">
      <div class="progress-label">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        Processing nodes
      </div>
      <span class="progress-count" id="progress-text">0/0</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- Icon Preview -->
  <div id="icon-preview" class="icon-preview">
    <div class="icon-preview-header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
        <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
        <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
        <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.555C21.965 6.012 17.461 2 12 2z"/>
      </svg>
      <h3>Icons Found</h3>
      <span class="badge" id="icon-count">0</span>
    </div>
    <div class="icon-grid" id="icon-grid"></div>
  </div>

  <!-- Button Row -->
  <div class="button-row">
    <button class="btn-primary" id="copy-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
      </svg>
      Copy to Clipboard
    </button>
    <button class="btn-secondary" id="copy-json-btn" title="Copy JSON">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"/>
        <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
        <path d="m5 12-3 3 3 3"/>
        <path d="m9 18 3-3-3-3"/>
      </svg>
      JSON
    </button>
    <button class="btn-secondary" id="copy-tailwind-btn" title="Copy Tailwind">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
      </svg>
      CSS
    </button>
    <button class="btn-icon" id="refresh-btn" title="Refresh">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
    </button>
    <button class="btn-icon" id="close-btn" title="Close">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18"/>
        <path d="m6 6 12 12"/>
      </svg>
    </button>
  </div>

  <!-- Status -->
  <div class="status" id="status">
    <svg id="status-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
    <span id="status-text"></span>
  </div>

  <script>
    let currentData = {
      consoleOutput: '',
      jsonOutput: '',
      tailwindOutput: '',
      rawStructure: null,
      images: []
    };

    // Icons for status
    const checkIcon = '<path d="M20 6 9 17l-5-5"/>';
    const errorIcon = '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>';

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.output').forEach(o => o.classList.remove('active'));
        
        tab.classList.add('active');
        const tabName = tab.dataset.tab;
        document.getElementById(tabName + '-output').classList.add('active');
      });
    });

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function base64ToBlob(base64, mimeType) {
      const binary = atob(base64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new Blob([bytes], { type: mimeType });
    }

    function triggerDownload(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadImageItem(image) {
      const blob = base64ToBlob(image.dataBase64, image.mimeType);
      triggerDownload(blob, image.fileName);
    }

    function downloadAllImages(images) {
      images.forEach((img, i) => {
        setTimeout(() => downloadImageItem(img), i * 200);
      });
    }

    function renderImageList(images) {
      const list = document.getElementById('images-list');
      const summary = document.getElementById('images-summary');
      const downloadAllBtn = document.getElementById('download-all-images-btn');
      currentData.images = images || [];

      if (!images || images.length === 0) {
        summary.textContent = 'No image fills found in the selected block';
        downloadAllBtn.disabled = true;
        list.innerHTML = '<div class="empty-state"><p>No IMAGE fills detected under this selection. Image must be applied as a layer fill (not only as a placed image node). Open the Debug tab after refresh for [IMAGE] logs.</p></div>';
        return;
      }

      summary.textContent = `${images.length} image${images.length === 1 ? '' : 's'} in selection`;
      downloadAllBtn.disabled = false;
      list.innerHTML = images.map((img, index) => {
        const src = `data:${img.mimeType};base64,${img.dataBase64}`;
        const details = `${Math.round(img.width)}×${Math.round(img.height)} · ${img.type} · ${img.fileName}`;
        return `
          <div class="image-row" data-image-index="${index}">
            <img class="image-thumb" src="${src}" alt="" />
            <div class="image-info">
              <div class="name" title="${escapeHtml(img.name)}">${escapeHtml(img.name)}</div>
              <div class="details">${escapeHtml(details)}</div>
            </div>
            <button type="button" class="btn-secondary image-download-btn" data-image-index="${index}">Download</button>
          </div>
        `;
      }).join('');

      list.querySelectorAll('.image-download-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-image-index'), 10);
          downloadImageItem(images[idx]);
          showToast(`Downloaded ${images[idx].fileName}`);
        });
      });
    }

    document.getElementById('download-all-images-btn').addEventListener('click', () => {
      if (!currentData.images || currentData.images.length === 0) return;
      downloadAllImages(currentData.images);
      showToast(`Downloading ${currentData.images.length} images`);
    });

    // Extract icons from structure
    function extractIcons(structure) {
      const icons = [];
      
      function traverse(node) {
        if (node.isIcon && node.svg) {
          icons.push({ name: node.name, svg: node.svg });
        }
        if (node.children) {
          node.children.forEach(traverse);
        }
      }
      
      if (Array.isArray(structure)) {
        structure.forEach(traverse);
      } else if (structure) {
        traverse(structure);
      }
      
      return icons;
    }

    // Render icon previews
    function renderIcons(icons) {
      const container = document.getElementById('icon-preview');
      const grid = document.getElementById('icon-grid');
      const countBadge = document.getElementById('icon-count');
      
      if (icons.length === 0) {
        container.classList.remove('visible');
        return;
      }
      
      container.classList.add('visible');
      countBadge.textContent = icons.length;
      
      grid.innerHTML = icons.map((icon, index) => `
        <div class="icon-item" data-icon-index="${index}">
          ${icon.svg}
          <span title="${icon.name}">${icon.name}</span>
        </div>
      `).join('');

      // Add click handlers to copy SVG
      grid.querySelectorAll('.icon-item').forEach((item, index) => {
        item.addEventListener('click', async () => {
          const svg = icons[index].svg;
          await copyToClipboard(svg);
          
          // Visual feedback on the item
          item.classList.add('copied');
          setTimeout(() => item.classList.remove('copied'), 400);
          
          // Show toast
          showToast(`Copied "${icons[index].name}" SVG`);
        });
      });
    }

    // Show toast notification
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      toastMessage.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Copy to clipboard
    async function copyToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      textarea.style.pointerEvents = 'none';
      document.body.appendChild(textarea);
      textarea.select();
      
      try {
        document.execCommand('copy');
        showStatus('Copied to clipboard!', 'success');
        parent.postMessage({ pluginMessage: { type: 'copy-success' } }, '*');
      } catch (err) {
        showStatus('Failed to copy: ' + err.message, 'error');
      } finally {
        document.body.removeChild(textarea);
      }
    }

    function showStatus(message, type) {
      const status = document.getElementById('status');
      const statusIcon = document.getElementById('status-icon');
      const statusText = document.getElementById('status-text');
      
      statusText.textContent = message;
      statusIcon.innerHTML = type === 'success' ? checkIcon : errorIcon;
      status.className = 'status ' + type;
      
      setTimeout(() => {
        status.className = 'status';
      }, 2500);
    }

    // Button handlers
    document.getElementById('copy-btn').addEventListener('click', () => {
      const activeTab = document.querySelector('.tab.active').dataset.tab;
      let text;
      if (activeTab === 'console') {
        text = currentData.consoleOutput;
      } else if (activeTab === 'json') {
        text = currentData.jsonOutput;
      } else if (activeTab === 'debug') {
        text = debugOutput.innerText;
      } else if (activeTab === 'images') {
        showToast('Use Download on each image or Download all');
        return;
      } else {
        text = currentData.tailwindOutput;
      }
      copyToClipboard(text);
    });

    document.getElementById('copy-json-btn').addEventListener('click', () => {
      copyToClipboard(currentData.jsonOutput);
    });

    document.getElementById('copy-tailwind-btn').addEventListener('click', () => {
      copyToClipboard(currentData.tailwindOutput);
    });

    document.getElementById('close-btn').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
    });

    document.getElementById('refresh-btn').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'refresh' } }, '*');
    });

    // Debug panel
    const debugOutput = document.getElementById('debug-output');

    function addDebugLog(message) {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.textContent = message;
      debugOutput.appendChild(entry);
      debugOutput.scrollTop = debugOutput.scrollHeight;
    }

    // Receive messages from plugin
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'debug') {
        addDebugLog(msg.message);
      }

      if (msg.type === 'progress') {
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const progressFill = document.getElementById('progress-fill');
        
        progressBar.classList.add('visible');
        progressText.textContent = `${msg.current}/${msg.total}`;
        const percent = (msg.current / msg.total) * 100;
        progressFill.style.width = percent + '%';
        
        document.getElementById('console-output').textContent = `Extracting structure... ${msg.current}/${msg.total} nodes`;
        document.getElementById('json-output').textContent = `Extracting structure... ${msg.current}/${msg.total} nodes`;
        document.getElementById('tailwind-output').textContent = `Extracting structure... ${msg.current}/${msg.total} nodes`;
      }
      
      if (msg.type === 'structure') {
        // Hide progress bar
        document.getElementById('progress-bar').classList.remove('visible');

        currentData = {
          consoleOutput: msg.consoleOutput,
          jsonOutput: msg.jsonOutput,
          tailwindOutput: msg.tailwindOutput,
          rawStructure: msg.rawStructure,
          images: msg.images || []
        };

        document.getElementById('console-output').textContent = msg.consoleOutput;
        document.getElementById('json-output').textContent = msg.jsonOutput;
        document.getElementById('tailwind-output').textContent = msg.tailwindOutput;

        renderImageList(msg.images || []);

        // Show debug logs bundled with structure
        if (msg.debugLogs && msg.debugLogs.length > 0) {
          msg.debugLogs.forEach(function(log) { addDebugLog(log); });
        }

        // Render icons
        const icons = extractIcons(msg.rawStructure);
        renderIcons(icons);
      }
    };
  </script>
</body>
</html>
